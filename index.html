<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Esha 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141417;
      --border: #222228;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.25);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-hand: 'Caveat', cursive;
      --shadow-pin: 0 16px 32px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(244, 63, 94, 0.12), transparent 45%),
        radial-gradient(#18181b 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 18px 60px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Top Greeting Tag */
    .title-tag {
      background: #ffffff;
      color: #0f172a;
      padding: 10px 28px;
      border-radius: 6px;
      box-shadow: var(--shadow-pin);
      transform: rotate(-1.5deg);
      margin-bottom: 34px;
    }

    .title-tag h1 {
      font-family: var(--font-hand);
      font-size: 2.6rem;
      line-height: 1;
      font-weight: 700;
    }

    .title-tag h1 span {
      color: var(--accent);
    }

    /* Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
      width: 100%;
      margin-bottom: 48px;
    }

    .polaroid {
      background: #ffffff;
      padding: 14px 14px 20px;
      border-radius: 4px;
      box-shadow: var(--shadow-pin);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      color: #0f172a;
    }

    .polaroid:nth-child(1) { transform: rotate(-2deg); }
    .polaroid:nth-child(2) { transform: rotate(2deg); }
    .polaroid:nth-child(3) { transform: rotate(-1deg); }

    .polaroid:hover {
      transform: scale(1.03) rotate(0deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    .polaroid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background: #18181b;
    }

    .polaroid-caption {
      font-family: var(--font-hand);
      font-size: 1.7rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 12px;
      line-height: 1.1;
    }

    /* Audio Player Box */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      margin-bottom: 36px;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .track-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .ctrl-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .ctrl-btn:hover {
      transform: scale(1.04);
      background: #e11d48;
    }

    footer {
      font-family: var(--font-hand);
      font-size: 1.6rem;
      color: var(--text-muted);
    }

    footer span {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="title-tag">
      <h1>happy birthday <span>esha ✨</span></h1>
    </header>

    <div class="gallery-grid">
      
      <div class="polaroid">
        <img src="bday.jpg" alt="bday" onerror="this.src='her.jpg'">
        <div class="polaroid-caption">special day ✨</div>
      </div>

      <div class="polaroid">
        <img src="her.jpg" alt="her" onerror="this.src='bday.jpg'">
        <div class="polaroid-caption">always glowing 🌸</div>
      </div>

      <div class="polaroid">
        <img src="she.jpg" alt="she" onerror="this.src='bday.jpg'">
        <div class="polaroid-caption">the prettiest ⚡</div>
      </div>

    </div>

    <div class="player-card">
      <div class="track-title">Happy Birthday Soundtrack 🎶</div>
      <div class="track-subtitle">Press play to listen</div>

      <audio id="bgMusic" src="music.mp3" preload="auto"></audio>
      
      <button id="playBtn" class="ctrl-btn" onclick="togglePlay()">▶ Play Music</button>
    </div>

    <footer>
      pinned with <span>❤️</span> by ujjwal
    </footer>

  </div>

  <script>
    const audio = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = '⏸ Pause';
        }).catch(err => {
          console.warn("Audio playback gesture needed:", err);
        });
      } else {
        audio.pause();
        playBtn.textContent = '▶ Play Music';
      }
    }

    audio.onended = () => {
      playBtn.textContent = '▶ Play Music';
    };
  </script>

</body>
</html>
